<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ajouter Réclamation</title>
  <!-- Lien CSS -->
  <link rel="stylesheet" th:href="@{/css/reclamation.css}">
</head>
<body>
<div class="container">
  <h2>Formulaire de Réclamation</h2>
  <form class="form-reclamation">
    <!-- ID citoyen caché -->
    <input type="hidden" id="citoyenId"
           th:value="${citoyenId}" />
    <!-- Titre -->
    <div class="form-group">
      <label>Titre :</label>
      <input type="text" id="titre"
             placeholder="Ex: Problème d'éclairage public"
             required>
    </div>
    <!-- Description -->
    <div class="form-group">
      <label>Description :</label>
      <textarea id="description"
                placeholder="Décrivez votre problème..."
                rows="5"
                required></textarea>
    </div>
    <!-- Quartier -->
    <div class="form-group">
      <label>Quartier / Adresse :</label>
      <input type="text" id="adressequartier"
             placeholder="Ex: Quartier Nouader"
             required>
    </div>
    <!-- Bouton -->
    <button type="submit" class="btn-submit">
      Envoyer Réclamation
    </button>

  </form>


  <!-- 🔽 TABLE DES RÉCLAMATIONS -->
  <div class="table-container">

    <h3>Mes Réclamations</h3>

    <table class="reclamation-table">

      <thead>
      <tr>
        <th>Titre</th>
        <th>Description</th>
        <th>Quartier</th>
        <th>Date</th>
        <th>Statut</th>
      </tr>
      </thead>

      <tbody id="reclamationTableBody">
      <!-- Les lignes seront ajoutées dynamiquement par JS -->
      </tbody>

    </table>

  </div>



</div>
<!-- 🔵 SCRIPT FETCH -->
<script>
  document.addEventListener("DOMContentLoaded", function () {

    const form = document.querySelector(".form-reclamation");
    const citoyenId = document.getElementById("citoyenId").value;
    const tbody = document.getElementById("reclamationTableBody");

    // 🔵 Fonction pour charger les réclamations
    function loadReclamations() {
      tbody.innerHTML = ""; // vider avant remplissage

      fetch("/reclamation/" + citoyenId)
              .then(response => {
                if (!response.ok) throw new Error("Erreur serveur");
                return response.json();
              })
              .then(data => {
                data.forEach(r => {
                  const tr = document.createElement("tr");
                  tr.innerHTML = `
                        <td>${r.titre}</td>
                        <td>${r.description}</td>
                        <td>${r.adressequartier}</td>
                        <td>${new Date(r.datedesoumission).toLocaleString()}</td>
                        <td>
                            <span class="status ${r.statut.toLowerCase().replace(/\s/g,'-')}">
                                ${r.statut}
                            </span>
                        </td>
                    `;
                  tbody.appendChild(tr);
                });
              })
              .catch(err => {
                console.error("Erreur chargement réclamations :", err);
              });
    }

    // Charger automatiquement au chargement de la page
    loadReclamations();

    // 🔴 Gestion du submit du formulaire
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const data = {
        titre: document.getElementById("titre").value,
        description: document.getElementById("description").value,
        adressequartier: document.getElementById("adressequartier").value,
        citoyen: { id: citoyenId }
      };

      fetch("/reclamation", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
              .then(response => {
                if (response.ok) {
                  alert("Réclamation envoyée avec succès ✅");
                  form.reset();           // vider le formulaire
                  loadReclamations();     // 🔄 mettre à jour la table
                } else {
                  alert("Erreur lors de l'envoi ❌");
                }
              })
              .catch(error => {
                console.error("Erreur :", error);
                alert("Erreur serveur ❌");
              });

    });

  });
</script>

</body>
</html>
