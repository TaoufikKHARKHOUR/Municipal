<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Authentification Employé Municipal</title>

    <!-- Lien CSS externe -->
    <link rel="stylesheet" href="/css/login.css">
    <!-- Thymeleaf version si besoin -->
    <!-- <link rel="stylesheet" th:href="@{/css/login.css}"> -->

</head>
<body>

<div class="login-container">

    <h2>Connexion Employé Municipal</h2>

    <form id="loginForm">

        <!-- EMAIL -->
        <div class="form-group">
            <label>Email :</label>
            <input type="email" id="email" required>
            <span class="error" id="emailError">
                Email incorrect
            </span>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label>Mot de passe :</label>
            <input type="password" id="password" required>
            <span class="error" id="passwordError">
                Mot de passe incorrect
            </span>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn-login">
            Se connecter
        </button>

    </form>

</div>

<!-- ================= JS ================= -->
<script>

    document.getElementById("loginForm")
        .addEventListener("submit", function(e){

            e.preventDefault();

            const emailInput = document.getElementById("email").value;
            const passwordInput = document.getElementById("password").value;

            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");

            emailError.style.display="none";
            passwordError.style.display="none";

            fetch("/administrateur")
                .then(res => res.json())
                .then(admins => {

                    let emailFound = false;
                    let passwordCorrect = false;

                    admins.forEach(admin => {

                        if(admin.email === emailInput){
                            emailFound = true;

                            if(admin.motdepasse === passwordInput){
                                passwordCorrect = true;
                            }
                        }

                    });

                    if(!emailFound && !passwordCorrect){
                        emailError.style.display="block";
                        passwordError.style.display="block";
                    }
                    else if(!emailFound){
                        emailError.style.display="block";
                    }
                    else if(!passwordCorrect){
                        passwordError.style.display="block";
                    }
                    else{
                        alert("Connexion réussie ✅");
                        window.location.href="/admin/reclamations";
                    }

                })
                .catch(err=>{
                    alert("Erreur serveur ❌");
                    console.error(err);
                });

        });

</script>

</body>
</html>
